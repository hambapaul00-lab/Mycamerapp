name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # --- SI VOUS AVEZ TÉLÉVERSÉ UN FICHIER .ZIP SUR GITHUB ---
    # Supprimez le symbole "#" de la ligne ci-dessous et remplacez "mon_projet.zip" par le nom exact de votre fichier ZIP :
    # - name: Unzip project
    #   run: unzip mon_projet.zip -d .

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

